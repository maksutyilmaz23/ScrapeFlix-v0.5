name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Find APK
        id: find_apk
        run: |
          APK_PATH=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload build logs branch on failure
        if: failure()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git checkout --orphan build-logs || git checkout build-logs
          git rm -rf . || true
          mkdir -p logs
          find . -name "*.log" -exec cp {} logs/ \; 2>/dev/null || true
          echo "Build failed at $(date)" > logs/status.txt
          git add logs/status.txt
          git commit -m "Build log $(date)" || true
          git push -f origin build-logs || true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: ScrapeFlix Build ${{ github.run_number }}
          files: ${{ steps.find_apk.outputs.apk_path }}
