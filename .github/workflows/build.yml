name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/build.log

      - name: Find APK
        id: find_apk
        run: |
          find app/build/outputs -type f > /tmp/outputs_listing.txt || true
          cat /tmp/outputs_listing.txt
          APK_PATH=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"
          echo "Resolved APK_PATH=[$APK_PATH]"

      - name: Push debug listing to build-logs
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          cp /tmp/outputs_listing.txt /tmp/outputs_listing.bak 2>/dev/null || echo "no outputs" > /tmp/outputs_listing.bak
          cp /tmp/build.log /tmp/build.log.bak 2>/dev/null || echo "no build log" > /tmp/build.log.bak
          git checkout --orphan build-logs-2 || git checkout build-logs-2
          git rm -rf . || true
          mkdir -p logs
          cp /tmp/outputs_listing.bak logs/outputs_listing.txt
          cp /tmp/build.log.bak logs/build.log
          tail -c 30000 logs/build.log > logs/build_tail.txt
          git add logs/outputs_listing.txt logs/build.log logs/build_tail.txt
          git commit -m "Debug listing $(date)" || true
          git push -f origin build-logs-2 || true
          git checkout main

      - name: Upload build logs branch on failure
        if: failure()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          cp /tmp/build.log /tmp/build.log.bak
          git checkout --orphan build-logs || git checkout build-logs
          git rm -rf . || true
          mkdir -p logs
          cp /tmp/build.log.bak logs/build.log
          echo "Build failed at $(date)" > logs/status.txt
          git add logs/build.log logs/status.txt
          git commit -m "Build log $(date)" || true
          git push -f origin build-logs || true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: ScrapeFlix Build ${{ github.run_number }}
          files: ${{ steps.find_apk.outputs.apk_path }}
